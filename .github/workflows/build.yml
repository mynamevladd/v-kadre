# Tests on every push; a tag like v0.1.0 also builds VKadre.exe and publishes a GitHub Release.
#
# New release:
#   1. bump `version` in vkadre-rs/Cargo.toml
#   2. write docs/releases/v<version>.md (release notes)
#   3. git tag v<version> && git push origin v<version>
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vkadre-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vkadre-rs

      - name: Tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Self-test (model loads, inference runs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release/models | Out-Null
          Copy-Item ../models/yolo11n-pose.onnx target/release/models/
          $p = Start-Process (Resolve-Path target/release/VKadre.exe) -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed: $($p.ExitCode)" }

      - name: Package
        shell: pwsh
        run: |
          $dir = "../VKadre"
          New-Item -ItemType Directory -Force "$dir/models" | Out-Null
          Copy-Item target/release/VKadre.exe $dir/
          Copy-Item ../models/yolo11n-pose.onnx "$dir/models/"
          Copy-Item ../LICENSE "$dir/LICENSE.txt"
          Compress-Archive -Path $dir -DestinationPath ../VKadre-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: VKadre-windows-x64
          path: VKadre-windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: В кадре ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: VKadre-windows-x64.zip
